server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida cai no index.html (React Router).
    # "expires -1" (no-cache): o index.html aponta para os assets com hash do
    # build atual; se o navegador o guardasse, seguiria rodando o app antigo
    # depois de um rebuild. Igual ao nginx.prod.conf.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
